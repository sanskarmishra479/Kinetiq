packages:
  - apps/*
  - packages/*
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  # Optional native speed-up for BullMQ's msgpackr; the pure-JS fallback is fine.
  msgpackr-extract: false
  prisma: true
# Security overrides for vulnerable transitive dependencies (pulled in by the
# Prisma CLI). Remove once Prisma ships patched versions itself.
# deepmerge-ts <8: GHSA-ggr8-5vv4-36mx · mysql2 <3.22: auth plugin downgrade
minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1137.0'
  - '@aws-sdk/s3-request-presigner@3.1137.0'
overrides:
  deepmerge-ts: 8.0.2
  mysql2: 3.24.4

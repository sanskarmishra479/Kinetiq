packages:
  - apps/*
  - packages/*
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
# Security overrides for vulnerable transitive dependencies (pulled in by the
# Prisma CLI). Remove once Prisma ships patched versions itself.
# deepmerge-ts <8: GHSA-ggr8-5vv4-36mx · mysql2 <3.22: auth plugin downgrade
overrides:
  deepmerge-ts: 8.0.2
  mysql2: 3.24.4

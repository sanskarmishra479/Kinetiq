# Local development services. Start: pnpm infra:up · Stop: pnpm infra:down
# These credentials are for local development only. Never reuse them anywhere else.
name: kinetiq

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kinetiq
      POSTGRES_PASSWORD: kinetiq
      POSTGRES_DB: kinetiq
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kinetiq -d kinetiq']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # BullMQ requires noeviction (NFR-SCALE-06); appendonly keeps queues across restarts.
    command: ['redis-server', '--maxmemory-policy', 'noeviction', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible storage standing in for Cloudflare R2.
  minio:
    image: quay.io/minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secret
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 3s
      retries: 20

  # Creates the two buckets once MinIO is up: private user content and our public files.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio-secret &&
      mc mb --ignore-existing local/kinetiq-content &&
      mc mb --ignore-existing local/kinetiq-public &&
      mc anonymous set download local/kinetiq-public
      "
    restart: 'no'

volumes:
  postgres-data:
  redis-data:
  minio-data:
